---
# Each VM: name (required) and the keys listed in README.md; a missing key takes its value from
# libvirt_vm_defaults, then the role's own (vars/main.yml).
libvirt_vm_vms: []

# Per-VM defaults, merged over the role's own (vars/main.yml, listed in README.md): a VM's own key wins
libvirt_vm_defaults: {}

# Where the XML files go, <name>.xml: never under /etc/libvirt or /var/lib/libvirt, where an undefine
# deletes files (Pacemaker's VirtualDomain undefines before every start)
libvirt_vm_xml_dir: /etc/libvirt_vm

# EFI firmware: OVMF of Debian 13 and Ubuntu (package ovmf); NVRAM copied from the template at first start
libvirt_vm_ovmf_code: /usr/share/OVMF/OVMF_CODE_4M.fd
libvirt_vm_ovmf_vars: /usr/share/OVMF/OVMF_VARS_4M.fd
libvirt_vm_nvram_dir: /var/lib/libvirt_vm/nvram

# virt-xml-validate checks each file before it is written
libvirt_vm_validate: true
libvirt_vm_packages:
  - libvirt-clients

# Pacemaker's VirtualDomain owns each domain: the role refuses define, start and autostart. false lets the role
# virsh define each VM (autostart, start if asked) and undefine an absent one.
libvirt_vm_pacemaker: true
libvirt_vm_uri: qemu:///system

# Remote images (a disk's backing_file or image URL), downloaded once, checksum verified
libvirt_vm_image_cache_dir: /var/cache/libvirt_vm
# One marker per block device written from an image: never written again, even with no signature left
libvirt_vm_dev_state_dir: /var/lib/libvirt_vm/devices
# A dev disk with an image that this host cannot write (read-only, or a replica not primary here): skip or fail
libvirt_vm_dev_unwritable: skip
# NoCloud seed ISOs, <name>-seed.iso; a VM's cloud_init.iso puts its own elsewhere (a replicated volume)
libvirt_vm_cloud_init_dir: /var/lib/libvirt_vm/cloud-init
# qemu-img creates disks; xorriso builds seed ISOs: installed only when a VM needs them
libvirt_vm_disk_packages:
  - qemu-utils
libvirt_vm_cloud_init_packages:
  - xorriso
