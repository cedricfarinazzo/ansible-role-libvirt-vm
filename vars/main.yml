---
# The per-VM values when neither the VM nor libvirt_vm_defaults sets them
__libvirt_vm_base:
  state: present
  memory_mib: 1024
  vcpus: 1
  # kvm on a host with /dev/kvm; qemu = software emulation (TCG)
  type: kvm
  machine: q35
  # host-passthrough | host-model | maximum (TCG) | none (no <cpu> element)
  cpu_mode: host-passthrough
  # bios | efi
  firmware: bios
  # Each {dev | file, format (raw), target, bus (virtio), cache (none), discard (unmap)}
  disks: []
  # Each {bridge, mac, model (virtio)}
  interfaces: []
  vnc: true
  vnc_listen: 127.0.0.1
  # A pty serial console (virsh console)
  serial: true
  # The org.qemu.guest_agent.0 virtio-serial channel (virsh domifaddr --source agent)
  guest_agent: true
  # Each new key below renders nothing new at its default: 1.0.0 inputs give the same XML
  uuid: null
  uuid_deterministic: false
  # x86_64 | aarch64
  arch: x86_64
  emulator: null
  # utc | localtime
  clock_offset: utc
  # Boot devices in order: hd | cdrom | network
  boot:
    - hd
  bootmenu: false
  bios_useserial: false
  # {type none|vnc|spice, listen, port (-1 = autoport), password}: replaces vnc and vnc_listen
  graphics: null
  video: virtio
  rng: false
  # A file instead of the pty serial console
  console_log: null
  console_log_append: false
  # Each {type pci|usb, source (pci) or vendor+product (usb), destination, alias, managed}
  hostdevs: []
  # {enabled, files {user-data, meta-data, network-config, vendor-data}, iso, target}
  cloud_init:
    enabled: false
  # A template of your own instead of domain.xml.j2, given the same __libvirt_vm_vm
  xml_template: null
  # libvirt_vm_pacemaker false only: virsh define, autostart at host boot, start now
  define: false
  autostart: false
  start: false

# Allowed keys per object: anything else fails validation, a typo never renders silently
__libvirt_vm_vm_keys:
  - name
  - state
  - memory_mib
  - vcpus
  - type
  - machine
  - cpu_mode
  - firmware
  - disks
  - interfaces
  - vnc
  - vnc_listen
  - serial
  - guest_agent
  - uuid
  - uuid_deterministic
  - arch
  - emulator
  - clock_offset
  - boot
  - bootmenu
  - bios_useserial
  - graphics
  - video
  - rng
  - console_log
  - console_log_append
  - hostdevs
  - cloud_init
  - xml_template
  - define
  - autostart
  - start
__libvirt_vm_disk_keys:
  - dev
  - file
  - format
  - target
  - bus
  - cache
  - discard
  - device
  - readonly
  - io
  - size
  - backing_file
  - backing_format
  - checksum
  - image
__libvirt_vm_disk_defaults:
  format: raw
  bus: virtio
  cache: none
  discard: unmap
  device: disk
  readonly: false
  io: null
__libvirt_vm_interface_keys:
  - type
  - bridge
  - network
  - dev
  - mode
  - mac
  - model
  - driver
  - alias
  - name
  - trust_guest_rx_filters
__libvirt_vm_interface_defaults:
  type: bridge
  model: virtio
  mode: vepa
  driver: null
  alias: null
  name: null
  trust_guest_rx_filters: false
__libvirt_vm_hostdev_keys:
  - type
  - source
  - vendor
  - product
  - destination
  - alias
  - managed
__libvirt_vm_hostdev_defaults:
  managed: true
  alias: null
  destination: null
__libvirt_vm_graphics_keys:
  - type
  - listen
  - port
  - password
__libvirt_vm_cloud_init_keys:
  - enabled
  - files
  - iso
  - target
__libvirt_vm_cloud_init_files:
  - user-data
  - meta-data
  - network-config
  - vendor-data

# Anchored with \Z: $ would accept a trailing newline. Kept here, not in Jinja literals, which unescape \.
__libvirt_vm_name_re: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}\Z'
__libvirt_vm_machine_re: '^[a-z0-9][a-z0-9_.-]{0,63}\Z'
# Unicast (even first octet), lower or upper case
__libvirt_vm_mac_re: '^[0-9A-Fa-f][02468ACEace](:[0-9A-Fa-f]{2}){5}\Z'
__libvirt_vm_bridge_re: '^[A-Za-z0-9_.-]{1,15}\Z'
__libvirt_vm_target_re: '^(vd|sd|hd)[a-z]{1,2}\Z'
__libvirt_vm_dev_re: '^/dev/[A-Za-z0-9_.:+/-]+\Z'
__libvirt_vm_path_re: '^/[A-Za-z0-9_.:+/-]+\Z'
__libvirt_vm_listen_re: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|[0-9A-Fa-f:]*:[0-9A-Fa-f:.]*)\Z'

__libvirt_vm_uuid_re: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\Z'
__libvirt_vm_size_re: '^[1-9][0-9]{0,8}[KMGT]?\Z'
__libvirt_vm_url_re: '^https?://[A-Za-z0-9_.:+/@%~=?&-]+\Z'
# algorithm:hex, as get_url takes it
__libvirt_vm_checksum_re: '^(sha256:[0-9a-f]{64}|sha512:[0-9a-f]{128})\Z'
# domain:bus:slot.function, as lspci -D prints it
__libvirt_vm_pci_re: '^[0-9A-Fa-f]{4}:[0-9A-Fa-f]{2}:[0-1][0-9A-Fa-f]\.[0-7]\Z'
__libvirt_vm_usb_id_re: '^0x[0-9A-Fa-f]{4}\Z'
# libvirt keeps only ua- aliases; the role adds the prefix
__libvirt_vm_alias_re: '^[A-Za-z0-9_-]{1,32}\Z'
# Printable, no quote, angle bracket or ampersand: the password lands in an XML attribute
__libvirt_vm_password_re: '^[A-Za-z0-9!#$%()*+,./:;=?@^_{|}~-]{1,64}\Z'
__libvirt_vm_template_re: '^[A-Za-z0-9_./-]+\.j2\Z'

__libvirt_vm_uri_re: '^qemu(\+[a-z]+)?://[A-Za-z0-9_.:@/-]*/(system|session)\Z'

__libvirt_vm_types:
  - kvm
  - qemu
__libvirt_vm_cpu_modes:
  - host-passthrough
  - host-model
  - maximum
  - none
__libvirt_vm_firmwares:
  - bios
  - efi
__libvirt_vm_states:
  - present
  - absent
__libvirt_vm_formats:
  - raw
  - qcow2
__libvirt_vm_buses:
  - virtio
  - sata
  - scsi
  - usb
__libvirt_vm_devices:
  - disk
  - cdrom
__libvirt_vm_ios:
  - null
  - native
  - threads
  - io_uring
__libvirt_vm_arches:
  - x86_64
  - aarch64
__libvirt_vm_clock_offsets:
  - utc
  - localtime
__libvirt_vm_boot_devs:
  - hd
  - cdrom
  - network
__libvirt_vm_graphics_types:
  - none
  - vnc
  - spice
__libvirt_vm_videos:
  - virtio
  - vga
  - qxl
  - bochs
  - none
__libvirt_vm_nic_types:
  - bridge
  - network
  - direct
__libvirt_vm_nic_modes:
  - vepa
  - bridge
  - private
  - passthrough
__libvirt_vm_nic_drivers:
  - vhost
  - qemu
__libvirt_vm_hostdev_types:
  - pci
  - usb
__libvirt_vm_caches:
  - none
  - default
  - writeback
  - writethrough
  - directsync
  - unsafe
__libvirt_vm_discards:
  - unmap
  - ignore
__libvirt_vm_nic_models:
  - virtio
  - e1000e
  - e1000
  - rtl8139
# libvirt's own directories (an undefine deletes files there) and . or .. path segments
__libvirt_vm_forbidden_re: '^/+(etc|var/+lib)/+libvirt(/|\Z)'
__libvirt_vm_dotseg_re: '(^|/)\.{1,2}(/|\Z)'
# Names of the VMs with state present (each VM merged with libvirt_vm_defaults)
__libvirt_vm_present: >-
  {% set out = [] %}{% for vm in libvirt_vm_vms %}{% if (__libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm)).state == 'present' %}{%
  set _ = out.append(vm.name) %}{% endif %}{% endfor %}{{ out }}
__libvirt_vm_efi: >-
  {% set out = [] %}{% for vm in libvirt_vm_vms %}{% if (__libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm)).firmware == 'efi' %}{%
  set _ = out.append(vm.name) %}{% endif %}{% endfor %}{{ out }}
# Disks the role creates or fills when absent: file disks with size, backing_file or image
__libvirt_vm_created: >-
  {% set out = [] %}{% for vm in libvirt_vm_vms %}{% set v = __libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm) %}{%
  if v.state == 'present' %}{% for d in v.disks %}{% if d.file is defined and (d.size is defined or d.backing_file is defined or d.image is defined) %}{%
  set _ = out.append(__libvirt_vm_disk_defaults | combine(d)) %}{% endif %}{% endfor %}{% endif %}{% endfor %}{{ out }}
# Remote images (backing_file or image an http(s) URL): downloaded once into libvirt_vm_image_cache_dir
__libvirt_vm_urls: >-
  {% set out = {} %}{% for d in __libvirt_vm_created %}{% for k in ['backing_file', 'image'] %}{% if d[k] is defined and d[k] is match('^https?://') %}{%
  set _ = out.update({d[k]: d.checksum}) %}{% endif %}{% endfor %}{% endfor %}{{ out }}
__libvirt_vm_cloud_init_vms: >-
  {% set out = [] %}{% for vm in libvirt_vm_vms %}{% set v = __libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm) %}{%
  if v.state == 'present' and v.cloud_init.enabled %}{% set _ = out.append(v) %}{% endif %}{% endfor %}{{ out }}
__libvirt_vm_console_dirs: >-
  {% set out = [] %}{% for vm in libvirt_vm_vms %}{% set v = __libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm) %}{%
  if v.state == 'present' and v.console_log is not none %}{% set _ = out.append(v.console_log | dirname) %}{% endif %}{% endfor %}{{ out | unique }}
# Present VMs with define true (libvirt_vm_pacemaker false only)
__libvirt_vm_define_vms: >-
  {% set out = [] %}{% for vm in libvirt_vm_vms %}{% set v = __libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm) %}{%
  if v.state == 'present' and v.define %}{% set _ = out.append(v) %}{% endif %}{% endfor %}{{ out }}
