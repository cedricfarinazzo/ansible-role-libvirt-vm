---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml"'
driver:
  name: docker
# Cloud-init: NoCloud seed ISOs built from the files, attached read-only; disabled = no cdrom
platforms:
  - name: libvirt-vm-cloudinit-${MOLECULE_DISTRO:-debian13}
    hostname: vmhost
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - vmhosts
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      vmhosts:
        molecule_packages:
          - xorriso
        libvirt_vm_vms:
          - name: vm1
            cloud_init:
              enabled: true
              files:
                user-data: |
                  #cloud-config
                  hostname: vm1
                network-config: |
                  version: 2
                  ethernets:
                    eth0:
                      dhcp4: true
          - name: vm2
            cloud_init:
              enabled: true
              iso: /srv/replicated/vm2-seed.iso
              target: sdc
              files:
                user-data: |
                  #cloud-config
                meta-data: |
                  instance-id: vm2-0001
          - name: vm3
            cloud_init:
              enabled: false
              files:
                user-data: "#cloud-config\n"
verifier:
  name: ansible
scenario:
  name: cloudinit
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - side_effect
    - destroy
