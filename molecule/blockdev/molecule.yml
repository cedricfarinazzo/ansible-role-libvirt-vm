---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml"'
driver:
  name: docker
# Block devices written from an image: loop devices behind /dev/molecule/<name>; the image a GPT disk served over HTTP as qcow2
platforms:
  - name: libvirt-vm-blockdev-${MOLECULE_DISTRO:-debian13}
    hostname: vmhost
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - vmhosts
provisioner:
  name: ansible
  playbooks:
    prepare: prepare/playbook.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
    cleanup: cleanup/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      vmhosts:
        molecule_packages:
          - qemu-utils
          - python3
          - fdisk
          - e2fsprogs
          - util-linux
        # The image checksums, computed by prepare into a local fact
        molecule_sha_raw: "sha256:{{ ansible_local.molecule.raw }}"
        molecule_sha_qcow2: "sha256:{{ ansible_local.molecule.qcow2 }}"
        libvirt_vm_vms:
          # Two empty devices: written once, from a URL (qcow2 converted to raw) and from a local raw image
          - name: written
            graphics:
              type: none
            disks:
              - dev: /dev/molecule/url
                target: vda
                image: http://127.0.0.1:8080/disk.qcow2
                checksum: "{{ molecule_sha_qcow2 }}"
              - dev: /dev/molecule/local
                target: vdb
                image: /srv/images/disk.raw
                checksum: "{{ molecule_sha_raw }}"
          # A filesystem and a partition table: the VM's data, never written
          - name: kept
            disks:
              - dev: /dev/molecule/fs
                target: vda
                image: /srv/images/disk.raw
              - dev: /dev/molecule/pt
                target: vdb
                image: /srv/images/disk.raw
          # A read-only device: skipped by default
          - name: readonly
            disks:
              - dev: /dev/molecule/ro
                target: vda
                image: /srv/images/disk.raw
verifier:
  name: ansible
scenario:
  name: blockdev
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - side_effect
    - cleanup
    - destroy
