---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml"'
driver:
  name: docker
# Interfaces: bridge, network and direct, driver and queues, alias, target name, MACs, list order kept
platforms:
  - name: libvirt-vm-nics-${MOLECULE_DISTRO:-debian13}
    hostname: vmhost
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - vmhosts
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      vmhosts:
        libvirt_vm_vms:
          - name: vm1
            interfaces:
              - bridge: br0
                mac: "02:00:00:00:10:01"
              - type: network
                network: default
                mac: "52:54:00:AA:BB:01"
                model: e1000e
                alias: lan1
              - type: direct
                dev: eth0
                mode: bridge
                mac: "02:00:00:00:10:03"
                driver:
                  name: vhost
                  queues: 4
                name: tap-vm1
                trust_guest_rx_filters: true
              - bridge: br1
                mac: "02:00:00:00:10:04"
                model: rtl8139
                driver:
                  name: qemu
verifier:
  name: ansible
scenario:
  name: nics
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - destroy
