---
# A changed password rewrites the files; the password never reaches the output, even at -vvv with --diff;
# a password held only in a graphics list is hidden as well.
- name: Graphics password secrecy
  hosts: vmhosts
  gather_facts: false
  tasks:
    - name: Rerun with another password
      ansible.builtin.include_tasks: ../../shared/recap.yml
      vars:
        molecule_label: another password
        molecule_args:
          - -vvv
          - --diff
          - -e
          - molecule_spice_password=molecule-pw-new-71b0
        molecule_expect: ok

    - name: Rewritten, neither password printed
      ansible.builtin.assert:
        that:
          - molecule_run.stdout is search('changed=1 ')
          - molecule_run.stdout is not search('molecule-pw-')
        fail_msg: "{{ molecule_run.stdout_lines[-6:] }}"

    - name: Run with a password only in a graphics list
      ansible.builtin.include_tasks: ../../shared/recap.yml
      vars:
        molecule_label: password in a list only
        molecule_args:
          - -vvv
          - --diff
          - -e
          - >-
            {"libvirt_vm_vms": [{"name": "listonly", "graphics": [{"type": "vnc"},
            {"type": "spice", "password": "molecule-pw-list-3c9a"}]}]}
        molecule_expect: ok

    - name: Rendered, the list password not printed
      ansible.builtin.assert:
        that:
          - molecule_run.stdout is search('changed=1 ')
          - molecule_run.stdout is not search('molecule-pw-')
        fail_msg: "{{ molecule_run.stdout_lines[-6:] }}"
