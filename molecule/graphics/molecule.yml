---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml"'
driver:
  name: docker
# Graphics: none, VNC on an address, SPICE on a fixed port with a password from a variable; lists of several devices
platforms:
  - name: libvirt-vm-graphics-${MOLECULE_DISTRO:-debian13}
    hostname: vmhost
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - vmhosts
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      vmhosts:
        molecule_spice_password: molecule-pw-8d2e
        libvirt_vm_vms:
          - name: none
            graphics:
              type: none
          - name: vnc
            graphics:
              listen: 192.0.2.10
            video: vga
          - name: spice
            graphics:
              type: spice
              listen: 0.0.0.0
              port: 5901
              password: "{{ molecule_spice_password }}"
            video: qxl
          - name: legacy
            vnc_listen: "::1"
          - name: both
            graphics:
              - listen: 127.0.0.1
              - type: spice
                listen: 127.0.0.1
                port: 5902
                password: "{{ molecule_spice_password }}"
          - name: listnone
            graphics:
              - type: none
          - name: listvnc
            graphics:
              - listen: 192.0.2.11
            video: vga
verifier:
  name: ansible
scenario:
  name: graphics
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - side_effect
    - destroy
