---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml"'
driver:
  name: docker
# A fresh host in check mode: nothing written, nothing installed
platforms:
  - name: libvirt-vm-check-${MOLECULE_DISTRO:-debian13}
    hostname: vmhost
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - vmhosts
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      vmhosts:
        libvirt_vm_vms:
          - name: web
            firmware: efi
            disks:
              - dev: /dev/vg0/web
                target: vda
verifier:
  name: ansible
scenario:
  name: check
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - side_effect
    - verify
    - destroy
