---
# Shared by every scenario: libvirt's daemon, so the checks can ask it which domains are defined.
- name: Prepare
  hosts: all
  tasks:
    # The image's policy-rc.d (exit 101) stops every postinst from starting its service: removed, so libvirt
    # starts at install as on a host
    - name: Packages start their services on install, as on a host
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent

    - name: Libvirt's daemon and the scenario's extra packages are installed
      ansible.builtin.apt:
        name: "{{ ['libvirt-daemon-system', 'iproute2', 'procps'] + molecule_packages | default([]) }}"
        update_cache: true
        cache_valid_time: 3600
