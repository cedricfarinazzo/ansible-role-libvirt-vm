---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml"'
driver:
  name: docker
# One host: each bad input fails in validation, naming the input, before any file is written
platforms:
  - name: libvirt-vm-failure-${MOLECULE_DISTRO:-debian13}
    hostname: vmhost
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - vmhosts
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      vmhosts:
        libvirt_vm_vms:
          - name: good
            interfaces:
              - bridge: br0
                mac: "02:00:00:00:02:01"
verifier:
  name: ansible
scenario:
  name: failure
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - destroy
