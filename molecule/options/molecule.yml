---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml"'
driver:
  name: docker
# One host without libvirt-clients: no validation, other directories and firmware, shared VM defaults
platforms:
  - name: libvirt-vm-options-${MOLECULE_DISTRO:-debian13}
    hostname: vmhost
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - vmhosts
provisioner:
  name: ansible
  playbooks:
    converge: ../shared/converge.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      vmhosts:
        # No validation, no package, other directories, defaults shared by every VM
        libvirt_vm_validate: false
        libvirt_vm_packages: []
        libvirt_vm_xml_dir: /srv/vm-xml
        libvirt_vm_nvram_dir: /srv/vm-nvram
        libvirt_vm_ovmf_code: /usr/share/OVMF/OVMF_CODE_4M.ms.fd
        libvirt_vm_ovmf_vars: /usr/share/OVMF/OVMF_VARS_4M.ms.fd
        libvirt_vm_defaults:
          memory_mib: 512
          firmware: efi
          vnc: false
        libvirt_vm_vms:
          - name: a
          - name: b
            memory_mib: 768
            firmware: bios
verifier:
  name: ansible
scenario:
  name: options
  test_sequence:
    - dependency
    - destroy
    - create
    - check
    - converge
    - verify
    - idempotence
    - destroy
