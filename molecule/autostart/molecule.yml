---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml"'
driver:
  name: docker
# libvirt_vm_pacemaker false: VMs defined, autostart on or off, one started under TCG; absent undefined
platforms:
  - name: libvirt-vm-autostart-${MOLECULE_DISTRO:-debian13}
    hostname: vmhost
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - vmhosts
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      vmhosts:
        molecule_packages:
          - qemu-system-x86
        libvirt_vm_pacemaker: false
        libvirt_vm_vms:
          - name: auto
            type: qemu
            cpu_mode: maximum
            memory_mib: 64
            define: true
            autostart: true
            start: true
          - name: manual
            type: qemu
            cpu_mode: maximum
            memory_mib: 64
            define: true
          - name: rendered
            type: qemu
            cpu_mode: maximum
verifier:
  name: ansible
scenario:
  name: autostart
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - side_effect
    - destroy
