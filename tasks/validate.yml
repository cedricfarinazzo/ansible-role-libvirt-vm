---
# Every input is asserted before any task writes: a bad value fails here, naming the input.
- name: Role settings are valid
  ansible.builtin.assert:
    that:
      - libvirt_vm_vms is sequence and libvirt_vm_vms is not string and libvirt_vm_vms is not mapping
      - libvirt_vm_defaults is mapping
      - libvirt_vm_defaults.keys() | difference(__libvirt_vm_vm_keys) | length == 0
      - "'name' not in libvirt_vm_defaults"
      - libvirt_vm_validate is boolean
      - libvirt_vm_packages is sequence and libvirt_vm_packages is not string and libvirt_vm_packages is not mapping
      - libvirt_vm_disk_packages is sequence and libvirt_vm_disk_packages is not string and libvirt_vm_disk_packages is not mapping
      - libvirt_vm_cloud_init_packages is sequence and libvirt_vm_cloud_init_packages is not string and libvirt_vm_cloud_init_packages is not mapping
      - libvirt_vm_pacemaker is boolean
      - libvirt_vm_uri is string and libvirt_vm_uri is match(__libvirt_vm_uri_re)
      - libvirt_vm_dev_unwritable in ['skip', 'fail']
    fail_msg: >-
      libvirt_vm_vms must be a list, libvirt_vm_defaults a mapping of VM keys without name,
      libvirt_vm_validate and libvirt_vm_pacemaker booleans, libvirt_vm_packages, libvirt_vm_disk_packages and
      libvirt_vm_cloud_init_packages lists, libvirt_vm_uri {{ __libvirt_vm_uri_re }}, libvirt_vm_dev_unwritable skip|fail
    quiet: true

- name: Directories and firmware paths are valid
  ansible.builtin.assert:
    that:
      - __libvirt_vm_item.value is string
      - __libvirt_vm_item.value is match(__libvirt_vm_path_re)
      - __libvirt_vm_item.value is not search(__libvirt_vm_dotseg_re)
      - __libvirt_vm_item.key in ['libvirt_vm_ovmf_code', 'libvirt_vm_ovmf_vars'] or __libvirt_vm_item.value is not match(__libvirt_vm_forbidden_re)
    fail_msg: >-
      {{ __libvirt_vm_item.key }}: {{ __libvirt_vm_item.value | string | to_json }} must be an absolute path of
      [A-Za-z0-9_.:+/-] with no . or .. segment; the role's directories never under /etc/libvirt or /var/lib/libvirt
    quiet: true
  loop: >-
    {{ {'libvirt_vm_xml_dir': libvirt_vm_xml_dir, 'libvirt_vm_nvram_dir': libvirt_vm_nvram_dir,
        'libvirt_vm_ovmf_code': libvirt_vm_ovmf_code, 'libvirt_vm_ovmf_vars': libvirt_vm_ovmf_vars,
        'libvirt_vm_image_cache_dir': libvirt_vm_image_cache_dir, 'libvirt_vm_cloud_init_dir': libvirt_vm_cloud_init_dir,
        'libvirt_vm_dev_state_dir': libvirt_vm_dev_state_dir} | dict2items }}
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.key }}"

- name: Each VM is a mapping with known keys and a valid name
  ansible.builtin.assert:
    that:
      - __libvirt_vm_item is mapping
      - __libvirt_vm_item.keys() | difference(__libvirt_vm_vm_keys) | length == 0
      - __libvirt_vm_item.name is defined and __libvirt_vm_item.name is string
      - __libvirt_vm_item.name is match(__libvirt_vm_name_re)
    fail_msg: >-
      libvirt_vm_vms[{{ __libvirt_vm_idx }}]: name
      {{ (__libvirt_vm_item.name | default('') if __libvirt_vm_item is mapping else __libvirt_vm_item) | string | to_json }}
      must match {{ __libvirt_vm_name_re }}; known keys: {{ __libvirt_vm_vm_keys | join(', ') }}
    quiet: true
  no_log: "{{ __libvirt_vm_secret }}"
  loop: "{{ libvirt_vm_vms }}"
  loop_control:
    loop_var: __libvirt_vm_item
    index_var: __libvirt_vm_idx
    label: "{{ __libvirt_vm_idx }}"

- name: VM names are unique
  ansible.builtin.assert:
    that:
      - __libvirt_vm_names | length == __libvirt_vm_names | unique | length
    fail_msg: "libvirt_vm_vms: a name is used twice in {{ __libvirt_vm_names | to_json }}"
    quiet: true
  vars:
    __libvirt_vm_names: "{{ libvirt_vm_vms | map(attribute='name') | list }}"

- name: Each VM's settings are valid
  ansible.builtin.assert:
    that:
      - __libvirt_vm_vm.state in __libvirt_vm_states
      - __libvirt_vm_vm.memory_mib is integer and __libvirt_vm_vm.memory_mib is not boolean and __libvirt_vm_vm.memory_mib >= 16
      - __libvirt_vm_vm.vcpus is integer and __libvirt_vm_vm.vcpus is not boolean and __libvirt_vm_vm.vcpus >= 1 and __libvirt_vm_vm.vcpus <= 512
      - __libvirt_vm_vm.type in __libvirt_vm_types
      - __libvirt_vm_vm.machine is string and __libvirt_vm_vm.machine is match(__libvirt_vm_machine_re)
      - __libvirt_vm_vm.cpu_mode in __libvirt_vm_cpu_modes
      - __libvirt_vm_vm.firmware in __libvirt_vm_firmwares
      - __libvirt_vm_vm.disks is sequence and __libvirt_vm_vm.disks is not string and __libvirt_vm_vm.disks is not mapping
      - __libvirt_vm_vm.interfaces is sequence and __libvirt_vm_vm.interfaces is not string and __libvirt_vm_vm.interfaces is not mapping
      - __libvirt_vm_vm.vnc is boolean
      - __libvirt_vm_vm.vnc_listen is string and __libvirt_vm_vm.vnc_listen is match(__libvirt_vm_listen_re)
      - __libvirt_vm_vm.serial is boolean
      - __libvirt_vm_vm.guest_agent is boolean
      - __libvirt_vm_vm.iothreads is integer and __libvirt_vm_vm.iothreads is not boolean and __libvirt_vm_vm.iothreads >= 0 and __libvirt_vm_vm.iothreads <= 64
      - __libvirt_vm_vm.balloon_free_page_reporting is boolean
      - __libvirt_vm_vm.balloon_autodeflate is boolean
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_vm.name }}: state present|absent, memory_mib an integer >= 16, vcpus 1-512, iothreads 0-64,
      type {{ __libvirt_vm_types | join('|') }}, machine {{ __libvirt_vm_machine_re }}, cpu_mode {{ __libvirt_vm_cpu_modes | join('|') }},
      firmware bios|efi, disks and interfaces lists, vnc/serial/guest_agent/balloon_* booleans, vnc_listen an IP address
    quiet: true
  no_log: "{{ __libvirt_vm_secret }}"
  loop: "{{ libvirt_vm_vms }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.name }}"
  vars:
    __libvirt_vm_vm: "{{ __libvirt_vm_base | combine(libvirt_vm_defaults) | combine(__libvirt_vm_item) }}"

- name: Each disk is valid
  ansible.builtin.assert:
    that:
      - __libvirt_vm_item.disk is mapping
      - __libvirt_vm_item.disk.keys() | difference(__libvirt_vm_disk_keys) | length == 0
      - (__libvirt_vm_item.disk.dev is defined) != (__libvirt_vm_item.disk.file is defined)
      - __libvirt_vm_item.disk.dev is not defined or (__libvirt_vm_item.disk.dev is string and __libvirt_vm_item.disk.dev is match(__libvirt_vm_dev_re)
        and __libvirt_vm_item.disk.dev is not search(__libvirt_vm_dotseg_re))
      - __libvirt_vm_item.disk.file is not defined or (__libvirt_vm_item.disk.file is string and __libvirt_vm_item.disk.file is match(__libvirt_vm_path_re)
        and __libvirt_vm_item.disk.file is not search(__libvirt_vm_dotseg_re))
      - __libvirt_vm_item.disk.target is defined and __libvirt_vm_item.disk.target is string and __libvirt_vm_item.disk.target is match(__libvirt_vm_target_re)
      - __libvirt_vm_disk.format in __libvirt_vm_formats
      - __libvirt_vm_disk.bus in __libvirt_vm_buses
      - __libvirt_vm_disk.cache in __libvirt_vm_caches
      - __libvirt_vm_disk.discard in __libvirt_vm_discards
      - __libvirt_vm_disk.device in __libvirt_vm_devices
      - __libvirt_vm_disk.readonly is boolean
      - __libvirt_vm_disk.io in __libvirt_vm_ios
      # An iothread exists in the VM (1..iothreads) and serves a virtio disk only
      - __libvirt_vm_disk.iothread is none or (__libvirt_vm_disk.iothread is integer and __libvirt_vm_disk.iothread is not boolean
        and __libvirt_vm_disk.iothread >= 1 and __libvirt_vm_disk.iothread <= __libvirt_vm_item.iothreads and __libvirt_vm_disk.bus == 'virtio')
      # Created or filled by the role: file disks, never a cdrom; a dev disk is checked by the next task; backing_file and image exclusive
      - (__libvirt_vm_disk.size is not defined and __libvirt_vm_disk.backing_file is not defined and __libvirt_vm_disk.image is not defined)
        or (__libvirt_vm_disk.file is defined and __libvirt_vm_disk.device == 'disk') or __libvirt_vm_disk.dev is defined
      - not (__libvirt_vm_disk.backing_file is defined and __libvirt_vm_disk.image is defined)
      - __libvirt_vm_disk.size is not defined or (__libvirt_vm_disk.size is string and __libvirt_vm_disk.size is match(__libvirt_vm_size_re))
      - __libvirt_vm_disk.backing_file is not defined or __libvirt_vm_disk.size is defined
      - __libvirt_vm_disk.backing_file is not defined or __libvirt_vm_disk.format == 'qcow2'
      - __libvirt_vm_disk.backing_format | default('qcow2') in __libvirt_vm_formats
      - __libvirt_vm_disk.backing_format is not defined or __libvirt_vm_disk.backing_file is defined
      - __libvirt_vm_disk.checksum is not defined or (__libvirt_vm_disk.checksum is string and __libvirt_vm_disk.checksum is match(__libvirt_vm_checksum_re))
      - __libvirt_vm_disk.checksum is not defined or __libvirt_vm_disk.backing_file is defined or __libvirt_vm_disk.image is defined
      - __libvirt_vm_src is none or (__libvirt_vm_src is string and (__libvirt_vm_src is match(__libvirt_vm_url_re)
        or (__libvirt_vm_src is match(__libvirt_vm_path_re) and __libvirt_vm_src is not search(__libvirt_vm_dotseg_re))))
      # A download is verified: a URL always comes with its checksum
      - __libvirt_vm_src is none or __libvirt_vm_src is not match('^https?://') or __libvirt_vm_disk.checksum is defined
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_item.vm }} disks[{{ __libvirt_vm_item.index }}]: {{ __libvirt_vm_item.disk | to_json }} needs exactly
      one of dev (/dev/...) or file (absolute path), a target ({{ __libvirt_vm_target_re }}), format {{ __libvirt_vm_formats | join('|') }},
      bus {{ __libvirt_vm_buses | join('|') }}, cache {{ __libvirt_vm_caches | join('|') }}, discard {{ __libvirt_vm_discards | join('|') }},
      device disk|cdrom, readonly a boolean, io native|threads|io_uring, iothread 1 to the VM's iothreads on a virtio disk; size ({{ __libvirt_vm_size_re }}), backing_file (needs size and
      format qcow2) only on a file disk, image on a file disk or a dev disk (format raw), either an absolute path or an http(s) URL with a checksum (sha256:|sha512:hex);
      known keys: {{ __libvirt_vm_disk_keys | join(', ') }}
    quiet: true
  loop: "{{ __libvirt_vm_disk_list }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.vm }} disks[{{ __libvirt_vm_item.index }}]"
  vars:
    __libvirt_vm_disk_list: >-
      {% set out = [] %}{% for vm in libvirt_vm_vms %}{% set v = __libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm) %}{% for d in v.disks %}{%
      set _ = out.append({'vm': vm.name, 'index': loop.index0, 'disk': d, 'iothreads': v.iothreads}) %}{% endfor %}{% endfor %}{{ out }}
    __libvirt_vm_disk: "{{ __libvirt_vm_disk_defaults | combine(__libvirt_vm_item.disk if __libvirt_vm_item.disk is mapping else {}) }}"
    __libvirt_vm_src: "{{ __libvirt_vm_disk.backing_file | default(__libvirt_vm_disk.image | default(none)) }}"

# A block device is never created or resized; its image is written raw, only once: no size, no qcow2 overlay, no cdrom
- name: Each block-device disk is valid
  ansible.builtin.assert:
    that:
      - __libvirt_vm_disk.size is not defined
      - __libvirt_vm_disk.backing_file is not defined
      - __libvirt_vm_disk.image is not defined or (__libvirt_vm_disk.format == 'raw' and __libvirt_vm_disk.device == 'disk')
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_item.vm }} disks[{{ __libvirt_vm_item.index }}]: {{ __libvirt_vm_item.disk | to_json }}: a dev disk takes
      no size (the device's own) and no backing_file (a qcow2 overlay needs a file disk); an image on a dev needs format raw and device disk
    quiet: true
  loop: "{{ __libvirt_vm_disk_list | selectattr('disk.dev', 'defined') | list }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.vm }} disks[{{ __libvirt_vm_item.index }}]"
  vars:
    __libvirt_vm_disk_list: >-
      {% set out = [] %}{% for vm in libvirt_vm_vms %}{% for d in (__libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm)).disks %}{%
      set _ = out.append({'vm': vm.name, 'index': loop.index0, 'disk': d}) %}{% endfor %}{% endfor %}{{ out }}
    __libvirt_vm_disk: "{{ __libvirt_vm_disk_defaults | combine(__libvirt_vm_item.disk) }}"

- name: Disk targets are unique within each VM
  ansible.builtin.assert:
    that:
      - __libvirt_vm_targets | length == __libvirt_vm_targets | unique | length
    fail_msg: "libvirt_vm_vms {{ __libvirt_vm_item.name }}: a disk target is used twice in {{ __libvirt_vm_targets | to_json }}"
    quiet: true
  no_log: "{{ __libvirt_vm_secret }}"
  loop: "{{ libvirt_vm_vms }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.name }}"
  vars:
    __libvirt_vm_v: "{{ __libvirt_vm_base | combine(libvirt_vm_defaults) | combine(__libvirt_vm_item) }}"
    __libvirt_vm_targets: >-
      {{ __libvirt_vm_v.disks | map(attribute='target') | list
         + ([__libvirt_vm_v.cloud_init.target | default('sdz', true)] if __libvirt_vm_v.cloud_init.enabled | default(false) is true else []) }}

- name: Each interface is valid
  ansible.builtin.assert:
    that:
      - __libvirt_vm_item.nic is mapping
      - __libvirt_vm_item.nic.keys() | difference(__libvirt_vm_interface_keys) | length == 0
      - __libvirt_vm_nic.type in __libvirt_vm_nic_types
      # Exactly the source key of its type: bridge, network or dev
      - (__libvirt_vm_nic.bridge is defined) == (__libvirt_vm_nic.type == 'bridge')
      - (__libvirt_vm_nic.network is defined) == (__libvirt_vm_nic.type == 'network')
      - (__libvirt_vm_nic.dev is defined) == (__libvirt_vm_nic.type == 'direct')
      - __libvirt_vm_nic.bridge is not defined or (__libvirt_vm_nic.bridge is string and __libvirt_vm_nic.bridge is match(__libvirt_vm_bridge_re))
      - __libvirt_vm_nic.dev is not defined or (__libvirt_vm_nic.dev is string and __libvirt_vm_nic.dev is match(__libvirt_vm_bridge_re))
      - __libvirt_vm_nic.network is not defined or (__libvirt_vm_nic.network is string and __libvirt_vm_nic.network is match(__libvirt_vm_name_re))
      - __libvirt_vm_nic.mode in __libvirt_vm_nic_modes
      - __libvirt_vm_item.nic.mac is defined and __libvirt_vm_item.nic.mac is string and __libvirt_vm_item.nic.mac is match(__libvirt_vm_mac_re)
      - __libvirt_vm_nic.model in __libvirt_vm_nic_models
      - __libvirt_vm_nic.driver is none or (__libvirt_vm_nic.driver is mapping and __libvirt_vm_nic.driver | length > 0
        and __libvirt_vm_nic.driver.keys() | difference(['name', 'queues']) | length == 0)
      - __libvirt_vm_nic.driver is none or __libvirt_vm_nic.driver is not mapping or __libvirt_vm_nic.driver.name | default('vhost') in __libvirt_vm_nic_drivers
      - __libvirt_vm_nic.driver is none or __libvirt_vm_nic.driver is not mapping or __libvirt_vm_nic.driver.queues is not defined
        or (__libvirt_vm_nic.driver.queues is integer and __libvirt_vm_nic.driver.queues is not boolean
            and __libvirt_vm_nic.driver.queues >= 1 and __libvirt_vm_nic.driver.queues <= 256)
      - __libvirt_vm_nic.alias is none or (__libvirt_vm_nic.alias is string and __libvirt_vm_nic.alias is match(__libvirt_vm_alias_re))
      # libvirt reserves vnet and macvtap names for its own
      - __libvirt_vm_nic.name is none or (__libvirt_vm_nic.name is string and __libvirt_vm_nic.name is match(__libvirt_vm_bridge_re)
        and __libvirt_vm_nic.name is not match('^(vnet|macvtap|macvlan)'))
      - __libvirt_vm_nic.trust_guest_rx_filters is boolean
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_item.vm }} interfaces[{{ __libvirt_vm_item.index }}]: {{ __libvirt_vm_item.nic | to_json }} needs
      type {{ __libvirt_vm_nic_types | join('|') }} with its source: bridge or dev ({{ __libvirt_vm_bridge_re }}) or network, a unicast mac
      (aa:bb:cc:dd:ee:ff), model {{ __libvirt_vm_nic_models | join('|') }}, mode {{ __libvirt_vm_nic_modes | join('|') }}, driver
      {name {{ __libvirt_vm_nic_drivers | join('|') }}, queues 1-256}, alias {{ __libvirt_vm_alias_re }}, name not vnet*/macvtap*,
      trust_guest_rx_filters a boolean; known keys: {{ __libvirt_vm_interface_keys | join(', ') }}
    quiet: true
  loop: "{{ __libvirt_vm_nic_list }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.vm }} interfaces[{{ __libvirt_vm_item.index }}]"
  vars:
    __libvirt_vm_nic_list: >-
      {% set out = [] %}{% for vm in libvirt_vm_vms %}{% for n in (__libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm)).interfaces %}{%
      set _ = out.append({'vm': vm.name, 'index': loop.index0, 'nic': n}) %}{% endfor %}{% endfor %}{{ out }}
    __libvirt_vm_nic: "{{ __libvirt_vm_interface_defaults | combine(__libvirt_vm_item.nic if __libvirt_vm_item.nic is mapping else {}) }}"

- name: MAC addresses are unique across VMs
  ansible.builtin.assert:
    that:
      - __libvirt_vm_macs | length == __libvirt_vm_macs | unique | length
    fail_msg: "libvirt_vm_vms: a MAC address is used twice in {{ __libvirt_vm_macs | to_json }}"
    quiet: true
  vars:
    __libvirt_vm_macs: >-
      {% set out = [] %}{% for vm in libvirt_vm_vms %}{% for n in (__libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm)).interfaces %}{%
      set _ = out.append(n.mac | lower) %}{% endfor %}{% endfor %}{{ out }}

- name: Each VM's other settings are valid
  ansible.builtin.assert:
    that:
      - __libvirt_vm_vm.uuid is none or (__libvirt_vm_vm.uuid is string and __libvirt_vm_vm.uuid is match(__libvirt_vm_uuid_re))
      - __libvirt_vm_vm.uuid_deterministic is boolean
      - __libvirt_vm_vm.arch in __libvirt_vm_arches
      - __libvirt_vm_vm.emulator is none or (__libvirt_vm_vm.emulator is string and __libvirt_vm_vm.emulator is match(__libvirt_vm_path_re)
        and __libvirt_vm_vm.emulator is not search(__libvirt_vm_dotseg_re))
      - __libvirt_vm_vm.clock_offset in __libvirt_vm_clock_offsets
      - __libvirt_vm_vm.boot is sequence and __libvirt_vm_vm.boot is not string and __libvirt_vm_vm.boot is not mapping
      - __libvirt_vm_vm.boot | length > 0
      - __libvirt_vm_vm.boot | difference(__libvirt_vm_boot_devs) | length == 0
      - __libvirt_vm_vm.boot | length == __libvirt_vm_vm.boot | unique | length
      - __libvirt_vm_vm.bootmenu is boolean
      - __libvirt_vm_vm.bios_useserial is boolean
      - __libvirt_vm_vm.video in __libvirt_vm_videos
      - __libvirt_vm_vm.rng is boolean
      - __libvirt_vm_vm.console_log is none or (__libvirt_vm_vm.console_log is string and __libvirt_vm_vm.console_log is match(__libvirt_vm_path_re)
        and __libvirt_vm_vm.console_log is not search(__libvirt_vm_dotseg_re))
      - __libvirt_vm_vm.console_log_append is boolean
      - __libvirt_vm_vm.hostdevs is sequence and __libvirt_vm_vm.hostdevs is not string and __libvirt_vm_vm.hostdevs is not mapping
      - __libvirt_vm_vm.xml_template is none or (__libvirt_vm_vm.xml_template is string and __libvirt_vm_vm.xml_template is match(__libvirt_vm_template_re)
        and __libvirt_vm_vm.xml_template is not search(__libvirt_vm_dotseg_re))
      - __libvirt_vm_vm.define is boolean
      - __libvirt_vm_vm.autostart is boolean
      - __libvirt_vm_vm.start is boolean
      - (__libvirt_vm_vm.autostart or __libvirt_vm_vm.start) is false or __libvirt_vm_vm.define
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_vm.name }}: uuid a UUID, arch {{ __libvirt_vm_arches | join('|') }}, emulator an absolute path,
      clock_offset utc|localtime, boot a non-empty list of distinct hd|cdrom|network, video {{ __libvirt_vm_videos | join('|') }},
      console_log an absolute path, hostdevs a list, xml_template a relative .j2 path; uuid_deterministic, bootmenu, bios_useserial, rng,
      console_log_append, define, autostart, start booleans; autostart and start need define
    quiet: true
  no_log: "{{ __libvirt_vm_secret }}"
  loop: "{{ libvirt_vm_vms }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.name }}"
  vars:
    __libvirt_vm_vm: "{{ __libvirt_vm_base | combine(libvirt_vm_defaults) | combine(__libvirt_vm_item) }}"

# VirtualDomain undefines a defined domain before each start, and a libvirt autostart races its own start
- name: No VM is defined, started or autostarted by the role under Pacemaker
  ansible.builtin.assert:
    that:
      - not libvirt_vm_pacemaker or not (__libvirt_vm_vm.define or __libvirt_vm_vm.autostart or __libvirt_vm_vm.start)
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_vm.name }}: define, start and autostart must stay false while libvirt_vm_pacemaker is true
      (VirtualDomain runs the domain); set libvirt_vm_pacemaker false for a VM libvirt runs alone
    quiet: true
  no_log: "{{ __libvirt_vm_secret }}"
  loop: "{{ libvirt_vm_vms }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.name }}"
  vars:
    __libvirt_vm_vm: "{{ __libvirt_vm_base | combine(libvirt_vm_defaults) | combine(__libvirt_vm_item) }}"

- name: Each VM's graphics are a mapping or a list of them
  ansible.builtin.assert:
    that:
      - __libvirt_vm_g is mapping or (__libvirt_vm_g is sequence and __libvirt_vm_g is not string and __libvirt_vm_g | length > 0
        and __libvirt_vm_g | reject('mapping') | list | length == 0)
      - __libvirt_vm_g is mapping or __libvirt_vm_types | unique | length == __libvirt_vm_types | length
      - __libvirt_vm_g is mapping or 'none' not in __libvirt_vm_types or __libvirt_vm_g | length == 1
      - __libvirt_vm_g is mapping or __libvirt_vm_ports | unique | length == __libvirt_vm_ports | length
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_item.name }} graphics: a mapping or a non-empty list of mappings; in a list each type once,
      none only alone, each fixed port once
    quiet: true
  loop: "{{ libvirt_vm_vms }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.name }}"
  no_log: "{{ __libvirt_vm_secret }}"
  # The merged value: a graphics set in libvirt_vm_defaults is checked as well
  when: __libvirt_vm_g is not none
  vars:
    __libvirt_vm_g: "{{ (__libvirt_vm_base | combine(libvirt_vm_defaults) | combine(__libvirt_vm_item)).graphics }}"
    __libvirt_vm_gl: "{{ __libvirt_vm_g | select('mapping') | list if __libvirt_vm_g is sequence and __libvirt_vm_g is not string else [] }}"
    __libvirt_vm_types: "{{ __libvirt_vm_gl | map(attribute='type', default='vnc') | list }}"
    __libvirt_vm_ports: "{{ __libvirt_vm_gl | map(attribute='port', default=-1) | reject('equalto', -1) | list }}"

- name: Each graphics entry is valid
  ansible.builtin.assert:
    that:
      - __libvirt_vm_g.keys() | difference(__libvirt_vm_graphics_keys) | length == 0
      - __libvirt_vm_g.type | default('vnc') in __libvirt_vm_graphics_types
      - __libvirt_vm_g.listen is not defined or (__libvirt_vm_g.listen is string and __libvirt_vm_g.listen is match(__libvirt_vm_listen_re))
      - __libvirt_vm_g.port is not defined or (__libvirt_vm_g.port is integer and __libvirt_vm_g.port is not boolean
        and (__libvirt_vm_g.port == -1 or (__libvirt_vm_g.port >= 5900 and __libvirt_vm_g.port <= 65535)))
      - __libvirt_vm_g.password is not defined or (__libvirt_vm_g.password is string and __libvirt_vm_g.password is match(__libvirt_vm_password_re))
    # The password never reaches the output
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_item.name }} graphics: keys {{ __libvirt_vm_graphics_keys | join(', ') }}; type
      {{ __libvirt_vm_graphics_types | join('|') }}, listen an IP address, port -1 or 5900-65535, password 1-64 characters without
      quote, angle bracket, ampersand, space or newline
    quiet: true
  loop: "{{ __libvirt_vm_graphics_entries }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.name }}"
  no_log: "{{ __libvirt_vm_secret }}"
  vars:
    __libvirt_vm_g: "{{ __libvirt_vm_item.g }}"

- name: Each hostdev is valid
  ansible.builtin.assert:
    that:
      - __libvirt_vm_item.hd is mapping
      - __libvirt_vm_item.hd.keys() | difference(__libvirt_vm_hostdev_keys) | length == 0
      - __libvirt_vm_hd.type is defined and __libvirt_vm_hd.type in __libvirt_vm_hostdev_types
      # pci by host address; usb by vendor and product ids
      - (__libvirt_vm_hd.source is defined) == (__libvirt_vm_hd.type | default('') == 'pci')
      - (__libvirt_vm_hd.vendor is defined) == (__libvirt_vm_hd.type | default('') == 'usb')
      - (__libvirt_vm_hd.product is defined) == (__libvirt_vm_hd.type | default('') == 'usb')
      - __libvirt_vm_hd.source is not defined or (__libvirt_vm_hd.source is string and __libvirt_vm_hd.source is match(__libvirt_vm_pci_re))
      - __libvirt_vm_hd.vendor is not defined or (__libvirt_vm_hd.vendor is string and __libvirt_vm_hd.vendor is match(__libvirt_vm_usb_id_re))
      - __libvirt_vm_hd.product is not defined or (__libvirt_vm_hd.product is string and __libvirt_vm_hd.product is match(__libvirt_vm_usb_id_re))
      - __libvirt_vm_hd.destination is none or (__libvirt_vm_hd.destination is string and __libvirt_vm_hd.destination is match(__libvirt_vm_pci_re))
      - __libvirt_vm_hd.alias is none or (__libvirt_vm_hd.alias is string and __libvirt_vm_hd.alias is match(__libvirt_vm_alias_re))
      - __libvirt_vm_hd.managed is boolean
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_item.vm }} hostdevs[{{ __libvirt_vm_item.index }}]: {{ __libvirt_vm_item.hd | to_json }} needs type
      pci with source (dddd:bb:ss.f) or type usb with vendor and product (0xNNNN); destination a guest PCI address, alias
      {{ __libvirt_vm_alias_re }}, managed a boolean; known keys: {{ __libvirt_vm_hostdev_keys | join(', ') }}
    quiet: true
  loop: "{{ __libvirt_vm_hd_list }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.vm }} hostdevs[{{ __libvirt_vm_item.index }}]"
  vars:
    __libvirt_vm_hd_list: >-
      {% set out = [] %}{% for vm in libvirt_vm_vms %}{% for h in (__libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm)).hostdevs %}{%
      set _ = out.append({'vm': vm.name, 'index': loop.index0, 'hd': h}) %}{% endfor %}{% endfor %}{{ out }}
    __libvirt_vm_hd: "{{ __libvirt_vm_hostdev_defaults | combine(__libvirt_vm_item.hd if __libvirt_vm_item.hd is mapping else {}) }}"

- name: PCI host devices are given to one VM only
  ansible.builtin.assert:
    that:
      - __libvirt_vm_pcis | length == __libvirt_vm_pcis | unique | length
    fail_msg: "libvirt_vm_vms: a PCI host device is used twice in {{ __libvirt_vm_pcis | to_json }}"
    quiet: true
  vars:
    __libvirt_vm_pcis: >-
      {% set out = [] %}{% for vm in libvirt_vm_vms %}{% for h in (__libvirt_vm_base | combine(libvirt_vm_defaults) | combine(vm)).hostdevs %}{%
      if h.type == 'pci' %}{% set _ = out.append(h.source | lower) %}{% endif %}{% endfor %}{% endfor %}{{ out }}

# Seed files may hold secrets: never printed, in the message or the result
- name: Each VM's cloud-init is valid
  ansible.builtin.assert:
    that:
      - __libvirt_vm_ci is mapping
      - __libvirt_vm_ci.keys() | difference(__libvirt_vm_cloud_init_keys) | length == 0
      - __libvirt_vm_ci.enabled is defined and __libvirt_vm_ci.enabled is boolean
      - __libvirt_vm_ci.files | default({}) is mapping
      - (__libvirt_vm_ci.files | default({})).keys() | difference(__libvirt_vm_cloud_init_files) | length == 0
      - (__libvirt_vm_ci.files | default({})).values() | reject('string') | list | length == 0
      - not __libvirt_vm_ci.enabled or 'user-data' in __libvirt_vm_ci.files | default({})
      - __libvirt_vm_ci.iso is not defined or (__libvirt_vm_ci.iso is string and __libvirt_vm_ci.iso is match(__libvirt_vm_path_re)
        and __libvirt_vm_ci.iso is not search(__libvirt_vm_dotseg_re) and __libvirt_vm_ci.iso is not match(__libvirt_vm_forbidden_re))
      - __libvirt_vm_ci.target is not defined or (__libvirt_vm_ci.target is string and __libvirt_vm_ci.target is match(__libvirt_vm_target_re))
    fail_msg: >-
      libvirt_vm_vms {{ __libvirt_vm_item.name }} cloud_init: a mapping of {{ __libvirt_vm_cloud_init_keys | join(', ') }}; enabled a
      boolean; files a mapping of {{ __libvirt_vm_cloud_init_files | join(', ') }} to strings, user-data required when enabled; iso an
      absolute path, never under /etc/libvirt or /var/lib/libvirt; target {{ __libvirt_vm_target_re }}
    quiet: true
  loop: "{{ libvirt_vm_vms }}"
  loop_control:
    loop_var: __libvirt_vm_item
    label: "{{ __libvirt_vm_item.name }}"
  no_log: true
  vars:
    __libvirt_vm_ci: "{{ (__libvirt_vm_base | combine(libvirt_vm_defaults) | combine(__libvirt_vm_item)).cloud_init }}"
